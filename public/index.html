<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B"><link rel="manifest" href="/manifest.json"><title>OffDesktop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0B0B0B;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;padding:20px}
h1{color:#FFD400;font-size:20px;margin:0 0 20px}.s{display:none}.s.on{display:block}.muted{color:#8A8A8A;font-size:13px}
.card{background:#1A1A1A;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:20px}
.dot{width:9px;height:9px;border-radius:50%;background:#E24B4A;margin-left:auto}.dot.ok{background:#2ECC71}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:20px;font-size:17px;font-weight:600;margin-bottom:10px;text-align:left}
.y{background:#FFD400;color:#0B0B0B}.g{background:#1A1A1A;color:#fff;border:1px solid #333}
input.pin{width:100%;background:#1A1A1A;border:1px solid #333;color:#FFD400;border-radius:12px;padding:16px;font-size:26px;letter-spacing:8px;text-align:center;margin:12px 0}
.pick{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px 0}
.col{background:#1A1A1A;border-radius:12px;padding:10px 16px;text-align:center}.col b{display:block;font-size:34px;color:#FFD400;margin:6px 0}
.col button{background:none;border:1px solid #333;color:#fff;border-radius:8px;width:44px;height:36px;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.chips button{background:none;border:1px solid #333;color:#fff;border-radius:16px;padding:8px 14px;font-size:14px}
#banner{background:#1A1A1A;border:1px solid #FFD400;border-radius:12px;padding:14px;margin-bottom:16px;display:none}
#banner b{font-size:26px;color:#FFD400;display:block;margin:4px 0 10px}#err{color:#E24B4A;font-size:14px;min-height:20px;margin-top:14px}
</style></head><body>
<h1>OffDesktop</h1>

<div id="s-pin" class="s on"><div id="addrbox" style="display:none"><p class="muted">Endereço do PC (aparece na janela do PC).</p><input id="addr" class="pin" style="font-size:18px;letter-spacing:0" placeholder="192.168.0.10"></div>
<p class="muted">Digite o código que aparece no PC.</p>
<input id="pin" class="pin" inputmode="numeric" maxlength="6" placeholder="000000">
<button class="btn y" id="connect">Conectar</button></div>

<div id="s-home" class="s">
<div class="card"><div><div style="font-weight:600">Meu PC</div><div class="muted" id="st">Verificando...</div></div><span class="dot" id="dot"></span></div>
<div id="banner"><span class="muted">Desligamento em andamento</span><b id="left">--:--:--</b><button class="btn g" style="margin:0;padding:12px;text-align:center" id="cancel">Cancelar desligamento</button></div>
<button class="btn y" id="now">Desligar agora</button>
<button class="btn g" id="custom">Personalizado</button></div>

<div id="s-custom" class="s">
<button class="g" style="border-radius:8px;padding:8px 14px;margin-bottom:16px" id="back">‹ Voltar</button>
<p class="muted" style="text-align:center">Desligar o PC em</p>
<div class="pick">
<div class="col"><button data-u="h" data-d="1">+</button><b id="vh">0</b><span class="muted">horas</span><br><button data-u="h" data-d="-1">−</button></div>
<span style="font-size:28px;color:#8A8A8A">:</span>
<div class="col"><button data-u="m" data-d="5">+</button><b id="vm">30</b><span class="muted">minutos</span><br><button data-u="m" data-d="-5">−</button></div></div>
<div class="chips"><button data-q="15">15 min</button><button data-q="30">30 min</button><button data-q="60">1 h</button><button data-q="120">2 h</button></div>
<button class="btn y" style="text-align:center" id="go">Agendar desligamento</button>
<p class="muted" style="text-align:center" id="at"></p></div>
<p id="err" style="text-align:center"></p>

<script>
const $=s=>document.querySelector(s),f=n=>String(n).padStart(2,'0');
const isPC=location.port==='4455';
let pin=localStorage.getItem('pin')||'',base=localStorage.getItem('base')||'',h=0,m=30,timer=null;
const show=id=>{document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===id));$('#err').textContent=''};
async function api(p,method='GET',body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);
  try{
    const r=await fetch(base+'/api/'+p,{method,signal:c.signal,headers:{'X-Pin':pin,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j;
  }catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw new Error('Não consegui falar com o PC. Confira o Wi-Fi, o endereço e o firewall.');throw e}
  finally{clearTimeout(t)}}
async function refresh(){
  try{const s=await api('status');$('#dot').classList.add('ok');$('#st').textContent='Online agora';
    $('#banner').style.display=s.active?'block':'none';
    if(s.active){const l=s.secondsLeft;$('#left').textContent=`${f(Math.floor(l/3600))}:${f(Math.floor(l%3600/60))}:${f(l%60)}`}
  }catch(e){$('#dot').classList.remove('ok');$('#st').textContent='PC offline ou código inválido'}}
function enter(){show('s-home');refresh();clearInterval(timer);timer=setInterval(refresh,2000)}
async function shutdown(sec){try{await api('shutdown','POST',{seconds:sec});enter()}catch(e){$('#err').textContent=e.message}}
function draw(){$('#vh').textContent=h;$('#vm').textContent=f(m);
  const d=new Date(Date.now()+(h*60+m)*60000);$('#at').textContent=`O PC desliga às ${f(d.getHours())}:${f(d.getMinutes())}`}
$('#connect').onclick=async()=>{pin=$('#pin').value.trim();
  $('#err').textContent='Conectando...';if(!isPC){let a=$('#addr').value.trim();if(a){if(!/^https?:\/\//.test(a))a='http://'+a;if(!/:\d+$/.test(a))a+=':4455';base=a}}
  try{await api('status');localStorage.setItem('pin',pin);localStorage.setItem('base',base);enter()}catch(e){$('#err').textContent=e.message}};
let armed=false;
$('#now').onclick=()=>{const b=$('#now');if(!armed){armed=true;b.textContent='Toque de novo para confirmar';setTimeout(()=>{armed=false;b.textContent='Desligar agora'},4000);return}armed=false;b.textContent='Desligar agora';shutdown(10)};
$('#custom').onclick=()=>{show('s-custom');draw()};$('#back').onclick=()=>show('s-home');
$('#cancel').onclick=async()=>{await api('cancel','POST');refresh()};
$('#go').onclick=()=>{const sec=(h*60+m)*60;if(sec<10)return $('#err').textContent='Escolha um tempo maior que zero';shutdown(sec)};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;
  if(b.dataset.u==='h')h=Math.min(23,Math.max(0,h+d));else m=Math.min(55,Math.max(0,m+d));draw()});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q;h=Math.floor(q/60);m=q%60;draw()});
if(!isPC){$('#addrbox').style.display='block';$('#addr').value=base}
if(pin)enter();
</script></body></html>
